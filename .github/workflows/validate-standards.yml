name: Validate standards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON syntax
        run: python scripts/validate_json.py
      - name: Validate schema declarations
        run: python scripts/validate_schema_declarations.py
      - name: Validate controlled vocabularies
        run: python scripts/validate_vocabularies.py
